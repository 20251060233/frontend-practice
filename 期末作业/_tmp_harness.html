<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>form test temp</title>
<style>
  html,body{margin:0;padding:0;background:#fff8f0}
  #clip{width:760px;height:1000px;overflow:hidden;position:relative}
  iframe{border:0;display:block;position:absolute;left:0;top:0}
</style>
</head>
<body>
<div id="clip"><iframe id="f" src="dining.html" width="760" height="4200"></iframe></div>
<script>
document.getElementById('f').addEventListener('load', function () {
  setTimeout(function () {
    var d = f.contentWindow.document;
    var y = d.getElementById('reviewForm').getBoundingClientRect().top - 16;
    // 用负外边距把表单移动到裁剪视口顶部
    f.style.marginTop = (-y) + 'px';
    d.getElementById('reviewSubmit').click();
  }, 1800);
});
</script>
</body>
</html>
