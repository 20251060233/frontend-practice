<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
    <title>昆明美食地图</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 Flex布局 -->
    <header class="header-nav">
        <div class="brand">昆明美食地图</div>
        <nav class="nav-menu">
            <a href="#home">首页</a>
            <a href="#food">美食推荐</a>
            <a href="#intro">简介</a>
        </nav>
    </header>

    <main>
        <section class="banner">
            <h1>舌尖上的昆明</h1>
            <p>感受云南春城地道烟火风味</p>
        </section>

        <!-- Grid卡片墙，一共6张卡片 -->
        <section class="food-card-wall" id="food">
            <div class="food-card">
                <h3>过桥米线</h3>
                <p>云南经典美食，滚烫鲜汤搭配丰富配菜。</p>
            </div>
            <div class="food-card">
                <h3>汽锅鸡</h3>
                <p>蒸汽慢炖，鸡汤鲜香滋补，原汁原味。</p>
            </div>
            <div class="food-card">
                <h3>野生菌火锅</h3>
                <p>各类鲜菌荟萃，山林鲜香一口尽享。</p>
            </div>
            <div class="food-card">
                <h3>豆花米线</h3>
                <p>爽滑豆花配米线，酸辣开胃街边美味。</p>
            </div>
            <div class="food-card">
                <h3>烧豆腐</h3>
                <p>夜市必吃，外焦里嫩，蘸辣椒面超香。</p>
            </div>
            <div class="food-card">
                <h3>鲜花饼</h3>
                <p>玫瑰入馅，香甜酥软，昆明特色伴手礼。</p>
            </div>
        </section>

        <section class="intro-section" id="intro">
            <h2>关于昆明美食</h2>
            <p>昆明美食融合多民族饮食特色，酸辣鲜香各具特色，街头小吃与宴席名菜应有尽有。</p>
        </section>
    </main>

    <footer class="page-footer">
        <p>响应式专题页面作业</p>
    </footer>
</body>
</html>
