<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>校园地标 · A-Frame</title>
  <script src="libs/aframe.min.js"></script>
  <style>
    #tip { position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
           padding: 6px 14px; background: rgba(0,0,0,.55); color: #fff;
           border-radius: 16px; font: 13px/1.6 sans-serif; z-index: 9; pointer-events: none; }
  </style>
</head>
<body>
  <div id="tip">鼠标拖拽环视 · WASD 移动 · 点击校门开门</div>
  <a-scene>
    <!-- ===== 环境：天空 + 草地 + 中央大道 ===== -->
    <a-sky color="#aee3f7"></a-sky>
    <a-plane rotation="-90 0 0" width="26" height="26" color="#7cb342"></a-plane>
    <a-plane rotation="-90 0 0" position="0 0.01 0" width="3.2" height="14" color="#bdbdbd"></a-plane>

    <!-- ===== 云：多球组合，缓慢飘动 ===== -->
    <a-entity position="-6 7.5 -12" animation="property: position; to: -2 7.5 -12; dir: alternate; dur: 9000; loop: true">
      <a-sphere radius="0.8" color="#ffffff"></a-sphere>
      <a-sphere position="0.9 -0.1 0" radius="0.6" color="#f4fbff"></a-sphere>
      <a-sphere position="-0.85 -0.1 0" radius="0.55" color="#f4fbff"></a-sphere>
    </a-entity>
    <a-entity position="5 8.5 -14" animation="property: position; to: 9 8.5 -14; dir: alternate; dur: 11000; loop: true">
      <a-sphere radius="0.7" color="#ffffff"></a-sphere>
      <a-sphere position="0.8 0 0" radius="0.5" color="#f4fbff"></a-sphere>
    </a-entity>

    <!-- ===== 校门：双柱 + 横梁 + 双扇门板 ===== -->
    <a-box position="-2.6 1.5 5" width="0.5" height="3" depth="0.5" color="#8d6e63"></a-box>
    <a-box position="2.6 1.5 5" width="0.5" height="3" depth="0.5" color="#8d6e63"></a-box>
    <a-box position="0 3.25 5" width="5.7" height="0.5" depth="0.6" color="#6d4c41"></a-box>
    <!-- 点击门板沿横梁向两侧滑开 -->
    <a-box position="-1.2 1.3 5" width="2.3" height="2.6" depth="0.08" color="#90a4ae" class="door"
           animation__open="property: position; to: -3.4 1.3 5; dur: 1500; startEvents: click"></a-box>
    <a-box position="1.2 1.3 5" width="2.3" height="2.6" depth="0.08" color="#90a4ae" class="door"
           animation__open="property: position; to: 3.4 1.3 5; dur: 1500; startEvents: click"></a-box>

    <!-- ===== 主教学楼：楼体 + 红屋顶 + 门 + 窗户阵列 ===== -->
    <a-box position="0 1.6 -8" width="6" height="3.2" depth="2.5" color="#f5f5f5"></a-box>
    <a-box position="0 3.4 -8" width="6.6" height="0.35" depth="3" color="#b71c1c"></a-box>
    <a-box position="0 0.8 -6.72" width="0.9" height="1.6" depth="0.1" color="#6d4c41"></a-box>
    <!-- 一层窗户 -->
    <a-box position="-2.1 1.1 -6.72" width="0.55" height="0.7" depth="0.05" color="#fff59d"></a-box>
    <a-box position="-0.7 1.1 -6.72" width="0.55" height="0.7" depth="0.05" color="#fff59d"></a-box>
    <a-box position="0.7 1.1 -6.72" width="0.55" height="0.7" depth="0.05" color="#fff59d"></a-box>
    <a-box position="2.1 1.1 -6.72" width="0.55" height="0.7" depth="0.05" color="#fff59d"></a-box>
    <!-- 二层窗户 -->
    <a-box position="-2.1 2.3 -6.72" width="0.55" height="0.7" depth="0.05" color="#fff59d"></a-box>
    <a-box position="-0.7 2.3 -6.72" width="0.55" height="0.7" depth="0.05" color="#fff59d"></a-box>
    <a-box position="0.7 2.3 -6.72" width="0.55" height="0.7" depth="0.05" color="#fff59d"></a-box>
    <a-box position="2.1 2.3 -6.72" width="0.55" height="0.7" depth="0.05" color="#fff59d"></a-box>

    <!-- ===== 图书馆：台基 + 圆形大堂 + 穹顶 ===== -->
    <a-box position="-6.5 0.15 -7" width="4" height="0.3" depth="4" color="#e0e0e0"></a-box>
    <a-cylinder position="-6.5 1.7 -7" radius="1.7" height="2.8" color="#eceff1"></a-cylinder>
    <a-sphere position="-6.5 3.1 -7" radius="1.7" scale="1 0.55 1" color="#cfd8dc"></a-sphere>

    <!-- ===== 钟楼：塔身 + 锥顶 + 钟面 + 转动指针 ===== -->
    <a-box position="6.5 2.4 -7" width="2.2" height="4.8" depth="2.2" color="#f5f5f5"></a-box>
    <a-cone position="6.5 5.6 -7" radius-bottom="1.7" radius-top="0" height="1.6" color="#b71c1c"></a-cone>
    <a-cylinder position="6.5 3.8 -5.88" rotation="90 0 0" radius="0.7" height="0.06" color="#fffde7"></a-cylinder>
    <a-entity position="6.5 3.8 -5.83" animation="property: rotation; to: 0 0 -360; dur: 72000; loop: true; easing: linear">
      <a-box position="0 0.22 0" width="0.06" height="0.44" depth="0.02" color="#37474f"></a-box>
    </a-entity>

    <!-- ===== 旗杆与旗帜（摆动飘扬） ===== -->
    <a-cylinder position="2.8 2 0" radius="0.05" height="4" color="#9e9e9e"></a-cylinder>
    <a-box position="3.3 3.65 0" width="0.9" height="0.55" depth="0.04" color="#e53935"
           animation="property: rotation; to: 0 22 0; dir: alternate; dur: 800; loop: true"></a-box>

    <!-- ===== 路灯×2：灯杆 + 发光灯球（呼吸缩放） + 点光源 ===== -->
    <a-cylinder position="-2.5 1.3 2" radius="0.07" height="2.6" color="#616161"></a-cylinder>
    <a-sphere position="-2.5 2.7 2" radius="0.2" color="#fff59d"
              animation="property: scale; to: 1.25 1.25 1.25; dir: alternate; dur: 1200; loop: true"></a-sphere>
    <a-light type="point" position="-2.5 2.8 2" color="#fff59d" intensity="0.5" distance="8"></a-light>

    <a-cylinder position="2.5 1.3 -3" radius="0.07" height="2.6" color="#616161"></a-cylinder>
    <a-sphere position="2.5 2.7 -3" radius="0.2" color="#fff59d"
              animation="property: scale; to: 1.25 1.25 1.25; dir: alternate; dur: 1500; loop: true"></a-sphere>
    <a-light type="point" position="2.5 2.8 -3" color="#fff59d" intensity="0.5" distance="8"></a-light>

    <!-- ===== 树木×6：两种树形穿插分布 ===== -->
    <a-cylinder position="-5 0.5 0" radius="0.12" height="1" color="#795548"></a-cylinder>
    <a-sphere position="-5 1.4 0" radius="0.7" color="#43a047"></a-sphere>
    <a-cylinder position="5 0.5 -2" radius="0.12" height="1" color="#795548"></a-cylinder>
    <a-cone position="5 1.6 -2" radius-bottom="0.7" radius-top="0" height="1.4" color="#2e7d32"></a-cone>
    <a-cylinder position="-4 0.5 -4" radius="0.12" height="1" color="#795548"></a-cylinder>
    <a-sphere position="-4 1.4 -4" radius="0.65" color="#43a047"></a-sphere>
    <a-cylinder position="-4.5 0.5 -10.5" radius="0.12" height="1" color="#795548"></a-cylinder>
    <a-cone position="-4.5 1.6 -10.5" radius-bottom="0.7" radius-top="0" height="1.4" color="#2e7d32"></a-cone>
    <a-cylinder position="4.5 0.5 -10.5" radius="0.12" height="1" color="#795548"></a-cylinder>
    <a-sphere position="4.5 1.4 -10.5" radius="0.7" color="#43a047"></a-sphere>
    <a-cylinder position="6 0.5 2" radius="0.12" height="1" color="#795548"></a-cylinder>
    <a-cone position="6 1.6 2" radius-bottom="0.7" radius-top="0" height="1.4" color="#2e7d32"></a-cone>

    <!-- ===== 光源：环境光 + 方向光（模拟太阳） ===== -->
    <a-light type="ambient" color="#ffffff" intensity="0.65"></a-light>
    <a-light type="directional" position="1 5 3" intensity="0.5"></a-light>

    <!-- ===== 相机：校门外观望校园，支持鼠标环视 + WASD 移动 + 中央十字光标 ===== -->
    <a-camera position="0 1.8 7">
      <a-cursor cursor="fuse: false" raycaster="objects: .door" color="#2d3a4a"></a-cursor>
    </a-camera>
  </a-scene>
</body>
</html>
