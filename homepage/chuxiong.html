    <h1>我的家乡——楚雄</h1>

    <h2>城市简介</h2>
    <p>楚雄坐落于云南中部，是彝族文化的重要发源地，有着悠久的少数民族历史。这里气候舒适，物产丰富，多民族在这里和睦共处。</p>
    <p>每年的火把节是楚雄最盛大的节日，各族群众点燃火把，载歌载舞，展现独特的民族风情，吸引各地游客前来体验。</p>

    <h2>特色美食与景点</h2>
    <ul>
        <li>野生菌：雨季各类食用菌种类繁多，鲜香味美，是本地特色美食。</li>
        <li>彝家八大碗：传统彝族宴席，风味浓厚，代表彝族饮食文化。</li>
        <li>彝人古镇：集民族建筑、商铺、夜景于一体，感受彝族风情。</li>
    </ul>
