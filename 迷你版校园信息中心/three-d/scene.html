<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园三维导览 · Three.js</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* 返回条固定在最上层，不被 WebGL 画布遮挡 */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px;
      background: rgba(13, 58, 110, 0.85);
      color: #fff; font: 15px/1.6 "Microsoft YaHei", sans-serif;
    }
    .top-bar a {
      text-decoration: none; color: #0d3a6e; font-weight: 600;
      background: #ffd54f; padding: 4px 14px; border-radius: 16px;
    }
    #tip {
      position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
      padding: 6px 14px; background: rgba(0,0,0,.55); color: #fff;
      border-radius: 16px; font: 13px/1.6 "Microsoft YaHei", sans-serif;
      z-index: 9; pointer-events: none; white-space: nowrap;
    }
    @media (max-width: 575.98px) {
      #tip { font-size: 12px; top: 64px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <span>校园三维导览（复用课堂七 Three.js 场景）</span>
    <a href="../index.html#home">&larr; 返回首页</a>
  </div>
  <div id="tip">鼠标拖拽旋转 · 滚轮缩放 · 右键平移</div>
  <!-- WebGL 不可用时的降级提示（默认隐藏，scene.js 检测失败后显示） -->
  <div id="webglFallback" style="display:none;position:fixed;inset:0;z-index:20;
       background:#f2f6fb;align-items:center;justify-content:center;text-align:center;padding:24px">
    <div>
      <p style="font-size:1.2rem;color:#0d3a6e;font-weight:700">当前浏览器不支持或未开启 WebGL</p>
      <p style="color:#607d8b">请使用最新版 Chrome / Edge 并在设置中开启硬件加速后重试。</p>
      <a href="../index.html#three"
         style="display:inline-block;margin-top:8px;text-decoration:none;color:#fff;background:#1565c0;
                padding:8px 20px;border-radius:18px">返回首页</a>
    </div>
  </div>
  <script src="libs/three.min.js"></script>
  <script src="libs/OrbitControls.js"></script>
  <script src="scene.js"></script>
</body>
</html>
